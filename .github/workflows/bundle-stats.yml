# Frontend bundle-size tracking: comments the webpack bundle delta on each PR so
# growth is visible in review. Reporting only — never gates a merge.
name: Bundle Stats

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  compare:
    name: Compare bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (yarn 4 via packageManager field)
        run: corepack enable

      - uses: grafana/plugin-actions/bundle-size@bundle-size/v1.0.2
