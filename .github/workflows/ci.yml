# PR validation: lint + unit tests + build (check), then container-based
# integration and e2e tiers (live). Packaging and releasing live in cd.yml
# (tag-driven) — CI produces no plugin zip.
#
# Self-owned workflow following the external-plugin pattern (e.g.
# questdb/grafana-questdb-datasource) — the reusable grafana/plugin-ci-workflows
# pipeline is Grafana-org-internal (custom runner labels, GAR/GCS infra) and
# not usable from other orgs.
#
# The monthly cron catches drift in upstream images (crate/crate:latest,
# grafana/grafana:latest) that PR-triggered runs would miss.
name: CI

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 7 3 * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # is-compatible PR comment
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Lint (gofmt, go vet, actionlint, eslint, tsc)
        run: make lint

      - name: Unit tests (go + jest)
        run: make test

      - name: Build plugin (backend all platforms + frontend)
        run: make build

      # Convenience artifact: an installable build for test-driving the PR
      # ("try the zip from this run") and continuous validation of the
      # packaging path. Not a release — releases are cut by cd.yml on tags.
      - name: Package plugin zip
        run: make package

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: |
            *.zip
            *.zip.sha1
          retention-days: 7

      - name: Upload dist for the live jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

      # kept last on purpose: is-compatible runs its own actions/setup-node
      # (Node 16) that then shadows this job's Node 22 for every later step, so
      # any build/yarn step after it runs on the wrong Node
      - name: Check @grafana/* API compatibility with latest Grafana
        uses: grafana/plugin-actions/is-compatible@v1
        with:
          module: ./src/module.ts
          comment-pr: "yes"
          skip-comment-if-compatible: "yes"
          fail-if-incompatible: "no"
          targets: "@grafana/data,@grafana/ui,@grafana/runtime"

  live:
    name: Integration + e2e (CrateDB ${{ matrix.cratedb }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported release line, current stable, and tomorrow's
        # CrateDB. Nightly failures are signal, not blockers.
        cratedb: ["6.3.4", "latest", "nightly"]
    continue-on-error: ${{ matrix.cratedb == 'nightly' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Integration tests (in-process driver vs real CrateDB)
        run: make test-integration CRATEDB_IMAGE=crate/crate:${{ matrix.cratedb }}

      - name: E2E tests (hermetic CrateDB + Grafana, dist/ mounted)
        run: make e2e CRATEDB_IMAGE=crate/crate:${{ matrix.cratedb }}

  browser-smoke:
    # Playwright + @grafana/plugin-e2e against the compose dev stack. No secrets
    # involved, so this also runs on forked PRs.
    #
    # Cost split: a pull_request runs only the @critical subset on current
    # Grafana (fast feedback on the money paths); the monthly cron and manual
    # dispatch run the whole suite across the version matrix — the plugin.json
    # floor (React 18) and current stable (React 19) — which is where
    # version-sensitive UI drift (e.g. the ad-hoc control move in 13.x) surfaces.
    name: Browser tests (Grafana ${{ matrix.grafana }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        grafana: ${{ github.event_name == 'pull_request' && fromJSON('["latest"]') || fromJSON('["12.3.0", "latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Start dev stack
        env:
          GRAFANA_VERSION: ${{ matrix.grafana }}
        run: |
          chmod +x dist/gpx_cratedb_* 2>/dev/null || true
          docker compose up -d --wait

      - name: Seed demo data
        run: ./scripts/seed.sh

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      # PRs run the @critical subset; cron/dispatch run everything (empty grep).
      - name: Run browser tests
        env:
          GREP: ${{ github.event_name == 'pull_request' && '--grep @critical' || '' }}
        run: |
          read -ra grep_args <<< "$GREP"
          yarn e2e:browser "${grep_args[@]}"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-grafana-${{ matrix.grafana }}
          path: playwright-report/
          retention-days: 7

      - name: Stop dev stack
        if: always()
        run: docker compose down
