# Secret scanning (Trufflehog) on PRs and pushes to main. Trufflehog is the
# license-free scanner Grafana's own plugin pipeline uses; the gitleaks GitHub
# Action requires a paid license for organization repos.
name: Secret scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trufflehog:
    name: Trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # full history so push events scan the whole pushed range
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          extra_args: --results=verified,unknown
