name: Feature request
description: Suggest an improvement or new capability for the plugin.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: >-
        Describe the situation where the plugin currently falls short —
        ideally with the query or dashboard setup you were trying to build.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >-
        E.g. transformations, a different query shape.
